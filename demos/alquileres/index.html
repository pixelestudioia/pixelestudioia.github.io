<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporada · Demo de gestión de alquileres temporarios · Pixel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#17181c;--mu:#6b6e76;--li:#e3e5ea;--side:#0b0b0d;--R:#FF2A2A;--G:#1ED760;--B:#2D6BFF;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--rad:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit}
.demo-bar{background:#000;color:#fff;font-size:13px;font-weight:700;padding:7px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo-bar .px{display:inline-flex;gap:2px}.demo-bar .px i{width:4px;height:13px;display:block}
.px i:nth-child(1){background:var(--R)}.px i:nth-child(2){background:var(--G)}.px i:nth-child(3){background:var(--B)}
.demo-bar button{background:none;border:1px solid #444;color:#ddd;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 32px)}
aside{background:var(--side);color:#cfd0d4;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:900;color:#fff;font-size:21px;padding:4px 10px 18px;display:flex;align-items:center;gap:10px}
.brand small{display:block;font-size:11px;font-weight:700;color:#8b8d94;letter-spacing:.5px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14.5px;border:0;background:none;color:inherit;text-align:left;width:100%}
.nav:hover{background:#18191d;color:#fff}
.nav.on{background:#1d1f25;color:#fff}
.nav .dot{width:8px;height:8px;border-radius:2px;background:#3a3c44;flex:none}
.nav.on .dot{background:var(--G)}
.nav .badge{margin-left:auto;background:var(--R);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
h2{font-size:18px;font-weight:800;margin-bottom:12px}
.sub{color:var(--mu);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;background:#17181c;color:#fff;font-size:14px}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--li)}
.btn.g{background:var(--G);color:#03210e}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--li);border-radius:var(--rad);padding:18px}
.kpi .v{font-size:28px;font-weight:900;letter-spacing:-.5px}
.kpi .l{color:var(--mu);font-size:13px;font-weight:700}
.kpi .s{font-size:12.5px;color:var(--mu);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--li)}
td{padding:10px;border-bottom:1px solid var(--li);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#fafbfc}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-warn{background:#fef3c7;color:#92400e}.t-bad{background:#fee2e2;color:#991b1b}.t-mu{background:#eef0f3;color:#4b4e56}
.src{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.src-Airbnb{background:#ffe4e6;color:#be123c}.src-Booking{background:#dbeafe;color:#1e40af}.src-Directa{background:#e8f8ee;color:#166534}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--li);border-radius:10px;background:#fff}
.item .sq{width:10px;height:10px;border-radius:3px;flex:none}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:14.5px}
.item span.m{font-size:13px;color:var(--mu)}
.empty{color:var(--mu);font-size:14px;padding:6px 2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input,textarea{border:1px solid var(--li);border-radius:9px;padding:8px 10px;background:#fff;color:var(--tx)}
label{font-size:12.5px;font-weight:800;color:var(--mu);display:grid;gap:4px}
/* calendario */
.cal-wrap{overflow-x:auto;background:#fff;border:1px solid var(--li);border-radius:var(--rad)}
.cal{display:grid;min-width:900px;position:relative}
.cal .hd{font-size:11px;font-weight:800;color:var(--mu);text-align:center;padding:6px 0;border-bottom:1px solid var(--li);background:#fafbfc}
.cal .hd.we{color:#b45309}
.cal .pn{font-weight:800;font-size:13px;padding:0 10px;display:flex;align-items:center;border-bottom:1px solid var(--li);border-right:1px solid var(--li);background:#fff;position:sticky;left:0;z-index:2;min-height:46px}
.cal .pn small{display:block;color:var(--mu);font-weight:700;font-size:11px}
.cal .cell{border-bottom:1px solid var(--li);border-right:1px solid #f1f2f4;min-height:46px;cursor:pointer}
.cal .cell:hover{background:#f6f8ff}
.cal .cell.today{background:#fffbeb}
.bk{position:absolute;height:30px;border-radius:8px;color:#fff;font-size:12px;font-weight:800;padding:0 8px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15);z-index:1}
.bk.pend{opacity:.75;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.season{display:flex;gap:14px;font-size:12.5px;color:var(--mu);margin-top:10px;flex-wrap:wrap}
.season i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.ov.on{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h3{font-size:20px;font-weight:900;margin-bottom:4px}
.modal .x{float:right;border:0;background:#f1f2f4;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.fgrid .full{grid-column:1/-1}
.calc{background:#f6f7f9;border-radius:10px;padding:12px;font-size:14px;display:grid;gap:4px}
.calc .tot{font-weight:900;font-size:16px}
.err{color:var(--bad);font-weight:800;font-size:13.5px;min-height:18px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--li);margin:12px 0}
.tabs button{border:0;background:none;padding:8px 10px;font-weight:800;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-color:var(--tx)}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px}
.chk input{width:18px;height:18px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.msgtxt{background:#e7ffdb;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14px;white-space:pre-wrap;max-width:520px}
.toast{position:fixed;right:20px;bottom:20px;background:#17181c;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(120px);transition:transform .3s;z-index:60;max-width:360px}
.toast.on{transform:none}
.bar{display:grid;grid-template-columns:160px 1fr 110px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.bar .tr{background:#eef0f3;border-radius:6px;height:18px;overflow:hidden}
.bar .fl{height:100%;border-radius:6px}
.owner-hero{background:#0b0b0d;color:#fff;border-radius:var(--rad);padding:20px;margin-bottom:16px}
.owner-hero .sub{color:#a3a3a8}
.hide{display:none!important}
.menu-btn{display:none}
/* liquidación imprimible */
.liq{background:#fff;border:1px solid var(--li);border-radius:var(--rad);padding:26px}
.liq .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #17181c;padding-bottom:12px;margin-bottom:14px}
.liq .tot td{font-weight:900;font-size:15px;border-top:2px solid #17181c}
@media (max-width:980px){.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-105%);transition:transform .25s}
  aside.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:16px}
  .g4{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 80px}
}
@media print{
  body{background:#fff}
  .demo-bar,aside,.top,.noprint,.toast{display:none!important}
  .app{display:block}
  main{padding:0}
  .liq{border:0;padding:0}
}
</style>
</head>
<body>
<div class="demo-bar"><span class="px"><i></i><i></i><i></i></span> DEMO hecha por Pixel · datos ficticios · fecha simulada: 10 de enero de 2027 <button onclick="resetDemo()">Reiniciar demo</button></div>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="px" style="display:inline-flex;gap:3px"><i style="display:block;width:6px;height:22px"></i><i style="display:block;width:6px;height:22px"></i><i style="display:block;width:6px;height:22px"></i></span><div>Temporada<small>GESTIÓN DE ALQUILERES</small></div></div>
    <button class="nav on" data-v="panel"><span class="dot"></span>Hoy</button>
    <button class="nav" data-v="calendario"><span class="dot"></span>Calendario</button>
    <button class="nav" data-v="reservas"><span class="dot"></span>Reservas</button>
    <button class="nav" data-v="limpieza"><span class="dot"></span>Limpieza y mantenimiento <span class="badge" id="bTasks"></span></button>
    <button class="nav" data-v="mensajes"><span class="dot"></span>Mensajes <span class="badge" id="bMsgs"></span></button>
    <button class="nav" data-v="propiedades"><span class="dot"></span>Propiedades y tarifas</button>
    <button class="nav" data-v="liquidaciones"><span class="dot"></span>Liquidaciones</button>
    <button class="nav" data-v="reportes"><span class="dot"></span>Reportes</button>
    <button class="nav" data-v="propietario"><span class="dot"></span>Vista del propietario</button>
  </aside>
  <main id="main"></main>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= Utilidades ======================= */
const TODAY='2027-01-10';
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');
const D=s=>new Date(s+'T12:00:00');
const iso=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const nights=(a,b)=>Math.round((D(b)-D(a))/864e5);
const dmy=s=>{const d=D(s);return d.getDate()+'/'+(d.getMonth()+1)};
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['Do','Lu','Ma','Mi','Ju','Vi','Sá'];
const uid=p=>p+Math.random().toString(36).slice(2,8);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ======================= Datos de ejemplo ======================= */
function seed(){
  const owners=[
    {id:'o1',name:'Graciela Ferrari',commission:.18},
    {id:'o2',name:'Hernán Ibarra',commission:.20},
    {id:'o3',name:'Familia Duarte',commission:.20}];
  const props=[
    {id:'p1',name:'Casa Médanos',loc:'Villa Gesell',owner:'o1',cap:6,color:'#2D6BFF',rates:{alta:145000,media:95000,baja:60000},minN:{alta:5,media:3,baja:2},cleaning:35000},
    {id:'p2',name:'Casa Pinos',loc:'Mar de las Pampas',owner:'o1',cap:4,color:'#16a34a',rates:{alta:120000,media:80000,baja:50000},minN:{alta:5,media:3,baja:2},cleaning:30000},
    {id:'p3',name:'Depto. Centro',loc:'Villa Gesell',owner:'o2',cap:3,color:'#FF2A2A',rates:{alta:85000,media:60000,baja:40000},minN:{alta:4,media:2,baja:2},cleaning:22000},
    {id:'p4',name:'Dúplex Ostende',loc:'Pinamar',owner:'o2',cap:5,color:'#8b5cf6',rates:{alta:130000,media:90000,baja:55000},minN:{alta:5,media:3,baja:2},cleaning:30000},
    {id:'p5',name:'Cabaña del Bosque',loc:'Mar de las Pampas',owner:'o3',cap:4,color:'#d97706',rates:{alta:110000,media:75000,baja:45000},minN:{alta:4,media:3,baja:2},cleaning:28000}];
  const B=(prop,guest,phone,people,inn,out,source,status,depPct,paidAll)=>{const id=uid('r');return{id,prop,guest,phone,people,in:inn,out,source,status,total:0,deposit:0,paid:0,depPct,paidAll,checkin:{done:false,items:{}},checkout:{done:false},notes:''}};
  const bookings=[
    B('p1','Lucía Fernández','11 5523-8841',5,'2027-01-02','2027-01-09','Directa','confirmada',.3,true),
    B('p1','Martín Gómez','11 4412-0097',4,'2027-01-12','2027-01-18','Airbnb','confirmada',1,true),
    B('p1','Familia Rossi','221 433-1290',6,'2027-01-20','2027-01-27','Directa','confirmada',.3,false),
    B('p2','Carla Méndez','11 6021-5532',2,'2027-01-05','2027-01-10','Booking','confirmada',1,true),
    B('p2','Diego Sosa','341 512-7764',4,'2027-01-14','2027-01-21','Directa','pendiente',0,false),
    B('p3','Ana Paula Ríos','11 3390-2214',2,'2027-01-08','2027-01-13','Airbnb','confirmada',1,true),
    B('p3','Tomás Herrera','223 504-8812',3,'2027-01-16','2027-01-22','Directa','confirmada',.3,false),
    B('p4','Familia Vidal','11 5871-6630',5,'2027-01-03','2027-01-11','Booking','confirmada',1,true),
    B('p4','Sofía Benítez','11 2245-9013',4,'2027-01-15','2027-01-25','Directa','confirmada',.3,false),
    B('p5','Nicolás Paz','351 677-1188',2,'2027-01-09','2027-01-14','Directa','confirmada',.3,false),
    B('p5','Valeria Luna','11 6634-0021',3,'2027-01-24','2027-01-30','Airbnb','confirmada',1,true),
    B('p3','Julieta Romero','11 4129-7756',2,'2026-12-28','2027-01-04','Directa','confirmada',.3,true)];
  const st={owners,props,bookings,tasks:[],msgs:[],expenses:[
    {id:uid('e'),prop:'p1',date:'2027-01-06',desc:'Reparación de canilla del baño',amount:18000},
    {id:uid('e'),prop:'p4',date:'2027-01-04',desc:'Reposición de garrafa',amount:26000},
    {id:uid('e'),prop:'p2',date:'2027-01-07',desc:'Corte de pasto',amount:15000}],
    staff:['Laura (limpieza)','Mirta (limpieza)','Ramón (mantenimiento)'],synced:false};
  bookings.forEach(b=>{const p=st.props.find(x=>x.id===b.prop);b.total=quote(st,p,b.in,b.out).total;b.deposit=Math.round(b.total*(b.depPct||.3));b.paid=b.paidAll?b.total:(b.status==='pendiente'?0:b.deposit);
    if(b.in<=TODAY){b.checkin.done=true;b.checkin.items={0:true,1:true,2:true,3:true,4:true,5:true}}if(b.out<=TODAY)b.checkout.done=true;
    delete b.depPct;delete b.paidAll;b.created=addDays(b.in,-20)<TODAY?addDays(b.in,-20):addDays(TODAY,-2);
    addCleaning(st,b,true)});
  st.tasks.push({id:uid('t'),prop:'p5',date:'2027-01-11',type:'Mantenimiento',who:'Ramón (mantenimiento)',status:'pendiente',desc:'Revisar termotanque (el huésped avisó que tarda en calentar)',bookingId:null});
  st.tasks.forEach(t=>{if(t.date<TODAY)t.status='hecha'});
  return st;
}
function seasonOf(s){const m=+s.slice(5,7),d=+s.slice(8,10);if((m===12&&d>=26)||m===1||m===2)return 'alta';if(m===12||m===3)return 'media';return 'baja'}
function quote(st,p,a,b){let total=0,n=nights(a,b);const per={alta:0,media:0,baja:0};for(let i=0;i<n;i++){const s=seasonOf(addDays(a,i));total+=p.rates[s];per[s]++}return{total,n,per,season:seasonOf(a),min:p.minN[seasonOf(a)]}}
function addCleaning(st,b,silent){if(st.tasks.some(t=>t.bookingId===b.id))return;st.tasks.push({id:uid('t'),prop:b.prop,date:b.out,type:'Limpieza',who:st.staff[st.props.findIndex(p=>p.id===b.prop)%2],status:'pendiente',desc:'Limpieza de salida y cambio de ropa blanca',bookingId:b.id})}

/* ======================= Estado ======================= */
const KEY='pixel-demo-alquileres-v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.props){S=seed();S._fresh=1}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function resetDemo(){try{localStorage.removeItem(KEY)}catch(e){}S=seed();markHistory();save();go(view);toast('Demo reiniciada')}
const P=id=>S.props.find(p=>p.id===id);
const O=id=>S.owners.find(o=>o.id===id);
const BK=id=>S.bookings.find(b=>b.id===id);
const active=()=>S.bookings.filter(b=>b.status!=='cancelada');
const overlap=(prop,a,b,except)=>active().find(x=>x.prop===prop&&x.id!==except&&a<x.out&&b>x.in);

/* ======================= Mensajes automáticos ======================= */
const TPL={
  confirmacion:{t:'Confirmación de reserva',f:b=>`¡Hola ${b.guest.split(' ')[0]}! Tu reserva en ${P(b.prop).name} está confirmada ✅\nEntrada: ${dmy(b.in)} desde las 14 h · Salida: ${dmy(b.out)} hasta las 10 h.\nTotal: ${fmt(b.total)} · Seña recibida: ${fmt(b.paid)}.\nCualquier consulta, escribinos por acá.`},
  llegada:{t:'Indicaciones de llegada',f:b=>`¡Hola ${b.guest.split(' ')[0]}! Te esperamos el ${dmy(b.in)} en ${P(b.prop).name} (${P(b.prop).loc}).\n📍 Ubicación: te mandamos el pin el día de llegada.\n🔑 Las llaves te las entregamos en la casa a las 14 h.\n📶 Wifi: Temporada2027`},
  saldo:{t:'Recordatorio de saldo',f:b=>`¡Hola ${b.guest.split(' ')[0]}! Te recordamos que queda un saldo de ${fmt(b.total-b.paid)} para tu estadía en ${P(b.prop).name}. Podés transferirlo al alias de siempre o abonarlo al llegar.`},
  gracias:{t:'Gracias y reseña',f:b=>`¡Gracias por elegirnos, ${b.guest.split(' ')[0]}! Esperamos que hayan disfrutado ${P(b.prop).name}. Si te gustó, nos ayuda mucho una reseña. ¡Hasta la próxima temporada! 🌊`}};
function scheduled(){const out=[];for(const b of active()){if(b.status!=='confirmada')continue;
  const items=[['confirmacion',b.created||TODAY],['llegada',addDays(b.in,-2)],['gracias',addDays(b.out,1)]];
  if(b.total-b.paid>0)items.push(['saldo',addDays(b.in,-3)]);
  for(const [k,date] of items){const sent=S.msgs.find(m=>m.bookingId===b.id&&m.type===k);out.push({b,k,date,sent})}}
  return out.sort((x,y)=>x.date.localeCompare(y.date))}
function markHistory(){scheduled().filter(x=>x.date<addDays(TODAY,-1)).forEach(x=>S.msgs.push({id:uid('m'),bookingId:x.b.id,type:x.k,date:x.date}));delete S._fresh}
if(S._fresh)markHistory();
function pendingMsgs(){return scheduled().filter(x=>!x.sent&&x.date<=TODAY)}

/* ======================= Navegación ======================= */
let view='panel',calMonth='2027-01',liqOwner='o1',liqMonth='2027-01',ownerView='o1',repMonth='2027-01';
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{go(n.dataset.v);$('#side').classList.remove('open')});
function go(v){view=v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===v));render();window.scrollTo(0,0)}

  </div>

      <h2 style="margin-top:16px">Próximas llegadas</h2><div class="list">${next.map(b=>itemB(b,dmy(b.in),'t-mu')).join('')}</div></div>

function itemB(b,lab,cls){const p=P(b.prop);return `<div class="item" style="cursor:pointer" onclick="openBooking('${b.id}')"><span class="sq" style="background:${p.color}"></span><div class="grow"><b>${esc(b.guest)} <span class="src src-${b.source}">${b.source}</span></b><span class="m">${p.name} · ${dmy(b.in)} al ${dmy(b.out)} · ${b.people} pers.</span></div><span class="tag ${cls}">${lab}</span></div>`}
function itemT(t){const p=P(t.prop);return `<div class="item"><span class="sq" style="background:${t.type==='Limpieza'?'var(--B)':'var(--R)'}"></span><div class="grow"><b>${t.type} · ${p.name}</b><span class="m">${dmy(t.date)} · ${esc(t.who)}<br>${esc(t.desc)}</span></div>${t.status==='hecha'?'<span class="tag t-ok">Hecha</span>':`<button class="btn sm g" onclick="doneTask('${t.id}')">Hecha</button>`}</div>`}
function itemM(x){return `<div class="item"><span class="sq" style="background:var(--G)"></span><div class="grow"><b>${TPL[x.k].t}</b><span class="m">${esc(x.b.guest)} · ${P(x.b.prop).name}</span></div><button class="btn sm g" onclick="sendMsg('${x.b.id}','${x.k}')">Enviar</button></div>`}

function calendario(){
  const [y,m]=calMonth.split('-').map(Number);const days=new Date(y,m,0).getDate();const start=calMonth+'-01';const end=addDays(start,days);
  const cols=`180px repeat(${days},minmax(26px,1fr))`;
  let h=`<div class="cal" id="cal" style="grid-template-columns:${cols}"><div class="hd" style="position:sticky;left:0;z-index:3;background:#fafbfc">Propiedad</div>`;
  for(let i=0;i<days;i++){const s=addDays(start,i),dw=D(s).getDay();h+=`<div class="hd ${dw===0||dw===6?'we':''}">${DIA[dw]}<br>${i+1}</div>`}
  S.props.forEach((p,r)=>{h+=`<div class="pn"><div>${p.name}<small>${p.loc}</small></div></div>`;for(let i=0;i<days;i++){const s=addDays(start,i);h+=`<div class="cell ${s===TODAY?'today':''}" onclick="newBooking('${p.id}','${s}')" title="Nueva reserva en ${p.name} el ${dmy(s)}"></div>`}});
  h+=`</div>`;
  setTimeout(()=>placeBars(start,end,days),0);
  const prev=iso(new Date(y,m-2,15)).slice(0,7),next=iso(new Date(y,m,15)).slice(0,7);
  return topbar('Calendario','Todas las propiedades en una sola vista. Tocá un día libre para cargar una reserva.',`<button class="btn sec sm" onclick="calMonth='${prev}';render()">◀</button><b style="min-width:120px;text-align:center;text-transform:capitalize">${MES[m-1]} ${y}</b><button class="btn sec sm" onclick="calMonth='${next}';render()">▶</button><button class="btn" onclick="newBooking()">+ Nueva reserva</button>`)+
  `<div class="cal-wrap">${h}</div><div class="season"><span><i style="background:#fffbeb;border:1px solid #f3d27a"></i>Hoy</span><span>Las rayas indican reservas pendientes de seña</span><span><span class="src src-Airbnb">Airbnb</span> <span class="src src-Booking">Booking</span> <span class="src src-Directa">Directa</span> según el origen</span></div>`;
}
function placeBars(start,end,days){const cal=$('#cal');if(!cal)return;const hd=cal.querySelector('.hd:nth-child(2)');const first=cal.querySelectorAll('.pn');
  const colW=(cal.scrollWidth-180)/days;
  active().forEach(b=>{if(b.out<=start||b.in>=end)return;const r=S.props.findIndex(p=>p.id===b.prop);const pn=first[r];
    const a=Math.max(0,nights(start,b.in)),z=Math.min(days,nights(start,b.out));
    const el=document.createElement('div');el.className='bk'+(b.status==='pendiente'?' pend':'');el.style.background=P(b.prop).color;
    el.style.left=(180+a*colW+colW*(b.in<start?0:.5))+'px';el.style.width=Math.max(18,(z-a)*colW-(b.in<start?0:colW*.5)+(b.out>end?0:colW*.5)-4)+'px';
    el.style.top=(pn.offsetTop+8)+'px';el.innerHTML=`<span class="src src-${b.source}" style="background:rgba(255,255,255,.9)">${b.source[0]}</span>${esc(b.guest)}`;el.onclick=()=>openBooking(b.id);cal.appendChild(el)})}
window.addEventListener('resize',()=>{if(view==='calendario')render()});

let resFilter='futuras';
function reservas(){
  let L=S.bookings.slice().sort((a,b)=>a.in.localeCompare(b.in));
  if(resFilter==='futuras')L=L.filter(b=>b.out>=TODAY&&b.status!=='cancelada');
  if(resFilter==='saldo')L=L.filter(b=>b.total-b.paid>0&&b.status!=='cancelada');
  return topbar('Reservas','Cada reserva con su huésped, seña, saldo y estado.',`<select onchange="resFilter=this.value;render()"><option value="futuras" ${resFilter==='futuras'?'selected':''}>En curso y futuras</option><option value="saldo" ${resFilter==='saldo'?'selected':''}>Con saldo pendiente</option><option value="todas" ${resFilter==='todas'?'selected':''}>Todas</option></select><button class="btn" onclick="newBooking()">+ Nueva reserva</button>`)+
  `<div class="card" style="overflow-x:auto"><table><tr><th>Huésped</th><th>Propiedad</th><th>Fechas</th><th>Origen</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr>
  ${L.map(b=>`<tr class="click" onclick="openBooking('${b.id}')"><td><b>${esc(b.guest)}</b><br><span class="sub">${b.people} pers. · ${esc(b.phone)}</span></td><td>${P(b.prop).name}</td><td>${dmy(b.in)} → ${dmy(b.out)}<br><span class="sub">${nights(b.in,b.out)} noches</span></td><td><span class="src src-${b.source}">${b.source}</span></td><td>${fmt(b.total)}</td><td>${fmt(b.paid)}</td><td>${b.total-b.paid>0?`<b style="color:var(--warn)">${fmt(b.total-b.paid)}</b>`:'—'}</td><td>${stTag(b)}</td></tr>`).join('')}</table></div>`;
}
function stTag(b){if(b.status==='cancelada')return '<span class="tag t-bad">Cancelada</span>';if(b.status==='pendiente')return '<span class="tag t-warn">Esperando seña</span>';if(b.out<=TODAY)return '<span class="tag t-mu">Finalizada</span>';if(b.in<=TODAY)return '<span class="tag t-ok">En la casa</span>';return '<span class="tag t-ok">Confirmada</span>'}

function propiedades(){
  return topbar('Propiedades y tarifas','Tarifas por temporada y mínimo de noches. Las reservas se cotizan solas.')+
  `<div class="card" style="overflow-x:auto"><table><tr><th>Propiedad</th><th>Propietario</th><th>Capacidad</th><th>Temporada alta<br><span style="font-weight:600">26/12 – 28/2</span></th><th>Media<br><span style="font-weight:600">diciembre y marzo</span></th><th>Baja</th><th>Limpieza</th></tr>
  ${S.props.map(p=>`<tr><td><span class="sq" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.color};margin-right:6px"></span><b>${p.name}</b><br><span class="sub">${p.loc}</span></td><td>${O(p.owner).name}<br><span class="sub">comisión ${Math.round(O(p.owner).commission*100)}%</span></td><td>${p.cap} pers.</td>
  ${['alta','media','baja'].map(s=>`<td><input type="number" value="${p.rates[s]}" style="width:110px" onchange="setRate('${p.id}','${s}',this.value)"><br><span class="sub">mín. ${p.minN[s]} noches</span></td>`).join('')}<td>${fmt(p.cleaning)}</td></tr>`).join('')}</table></div>

  <div class="row">${S.props.map(p=>`<span class="tag t-ok">${p.name}: Airbnb ✓ Booking ✓</span>`).join('')}</div><div style="margin-top:12px"><button class="btn sec" onclick="sync()">⟳ Sincronizar ahora</button></div></div>`;
}
function setRate(id,s,v){P(id).rates[s]=Math.max(0,+v||0);save();toast('Tarifa actualizada: las próximas reservas se cotizan con el valor nuevo')}

function liqData(owner,month){const props=S.props.filter(p=>p.owner===owner);const o=O(owner);const rows=[];let inc=0,clean=0,exp=0;
  for(const p of props){for(const b of active().filter(b=>b.prop===p.id&&b.status==='confirmada'&&b.in.slice(0,7)===month)){rows.push({kind:'Estadía',p,desc:`${b.guest} · ${dmy(b.in)} al ${dmy(b.out)} (${nights(b.in,b.out)} noches)`,amount:b.total});inc+=b.total;clean+=p.cleaning}
    for(const e of S.expenses.filter(e=>e.prop===p.id&&e.date.slice(0,7)===month)){rows.push({kind:'Gasto',p,desc:e.desc,amount:-e.amount});exp+=e.amount}}
  const com=inc*o.commission;return{o,props,rows,inc,com,clean,exp,net:inc-com-clean-exp}}

  <tr><td></td><td><b>Ingresos por alquileres</b></td><td style="text-align:right"><b>${fmt(d.inc)}</b></td></tr>
  <tr><td></td><td>Comisión de administración (${Math.round(d.o.commission*100)}%)</td><td style="text-align:right">-${fmt(d.com)}</td></tr>
  <tr><td></td><td>Limpiezas de salida</td><td style="text-align:right">-${fmt(d.clean)}</td></tr>
  <tr><td></td><td>Gastos y reparaciones</td><td style="text-align:right">-${fmt(d.exp)}</td></tr>
  <tr class="tot"><td></td><td>Neto a transferir al propietario</td><td style="text-align:right">${fmt(d.net)}</td></tr></table>
  <div class="sub" style="margin-top:14px">Demo con datos ficticios. En la versión real se envía por WhatsApp o mail al propietario con un clic.</div></div>`;

function occ(prop,month){const [y,m]=month.split('-').map(Number);const days=new Date(y,m,0).getDate();const st=month+'-01',en=addDays(st,days);let n=0;for(const b of active().filter(b=>b.prop===prop&&b.status==='confirmada')){const a=b.in>st?b.in:st,z=b.out<en?b.out:en;if(z>a)n+=nights(a,z)}return{n,days,pct:Math.round(n/days*100)}}
function income(prop,month){return active().filter(b=>b.prop===prop&&b.status==='confirmada'&&b.in.slice(0,7)===month).reduce((a,b)=>a+b.total,0)}
function reportes(){
  const rows=S.props.map(p=>({p,o:occ(p.id,repMonth),i:income(p.id,repMonth)}));const maxI=Math.max(1,...rows.map(r=>r.i));
  const tot=rows.reduce((a,r)=>a+r.i,0),avg=Math.round(rows.reduce((a,r)=>a+r.o.pct,0)/rows.length);
  const src={};active().filter(b=>b.in.slice(0,7)===repMonth).forEach(b=>src[b.source]=(src[b.source]||0)+1);
  return topbar('Reportes','Ocupación e ingresos por propiedad, mes a mes.',`<select onchange="repMonth=this.value;render()">${['2026-12','2027-01','2027-02'].map(x=>`<option value="${x}" ${x===repMonth?'selected':''}>${MES[+x.slice(5)-1]} ${x.slice(0,4)}</option>`).join('')}</select>`)+
  `<div class="grid g3"><div class="card kpi"><div class="l">Ocupación promedio</div><div class="v">${avg}%</div></div><div class="card kpi"><div class="l">Ingresos del mes</div><div class="v">${fmt(tot)}</div></div><div class="card kpi"><div class="l">Reservas por origen</div><div class="v" style="font-size:18px;margin-top:8px">${Object.entries(src).map(([k,v])=>`<span class="src src-${k}">${k} ${v}</span>`).join(' ')||'—'}</div></div></div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Ocupación</h2>${rows.map(r=>`<div class="bar"><span>${r.p.name}</span><div class="tr"><div class="fl" style="width:${r.o.pct}%;background:${r.p.color}"></div></div><b>${r.o.pct}% <span class="sub">(${r.o.n} n.)</span></b></div>`).join('')}</div>
  <div class="card"><h2>Ingresos</h2>${rows.map(r=>`<div class="bar"><span>${r.p.name}</span><div class="tr"><div class="fl" style="width:${r.i/maxI*100}%;background:${r.p.color}"></div></div><b>${fmt(r.i)}</b></div>`).join('')}</div></div>`;
}
function propietario(){

/* ======================= Acciones ======================= */
function doneTask(id){const t=S.tasks.find(t=>t.id===id);t.status='hecha';save();render();toast(`${t.type} de ${P(t.prop).name} marcada como hecha`)}
function sendMsg(bid,k){S.msgs.push({id:uid('m'),bookingId:bid,type:k,date:TODAY});save();render();toast(`${TPL[k].t} enviado a ${BK(bid).guest}`)}
function sendAll(){const p=pendingMsgs();p.forEach(x=>S.msgs.push({id:uid('m'),bookingId:x.b.id,type:x.k,date:TODAY}));save();render();toast(`${p.length} mensajes enviados`)}
function sync(){if(S.synced){toast('Calendarios al día: no hay reservas nuevas');return}
  const b={id:uid('r'),prop:'p2',guest:'Emma Wilson',phone:'+44 7700 900123',people:2,in:'2027-01-25',out:'2027-01-31',source:'Airbnb',status:'confirmada',total:0,deposit:0,paid:0,checkin:{done:false,items:{}},checkout:{done:false},notes:'Importada automáticamente desde Airbnb'};
  b.total=quote(S,P('p2'),b.in,b.out).total;b.paid=b.total;b.deposit=b.total;S.bookings.push(b);addCleaning(S,b);S.synced=true;save();render();toast('1 reserva nueva desde Airbnb: Casa Pinos, 25 al 31/1. Fechas bloqueadas en Booking ✓')}
function newTask(){modal(`<button class="x" onclick="closeM()">×</button><h3>Nueva tarea de mantenimiento</h3><div class="fgrid">
  <label>Propiedad<select id="tp">${S.props.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label>
  <label>Fecha<input type="date" id="td" value="${addDays(TODAY,1)}"></label>
  <label>Asignar a<select id="tw">${S.staff.map(s=>`<option>${s}</option>`).join('')}</select></label>
  <label class="full">Qué hay que hacer<input id="tdesc" placeholder="Ej.: cambiar lamparita del quincho"></label></div>
  <button class="btn" onclick="saveTask()">Guardar y avisar</button>`)}
function saveTask(){const desc=$('#tdesc').value.trim()||'Revisión general';S.tasks.push({id:uid('t'),prop:$('#tp').value,date:$('#td').value,type:'Mantenimiento',who:$('#tw').value,status:'pendiente',desc,bookingId:null});save();closeM();render();toast(`Tarea asignada a ${$('#tw')?.value||'el equipo'} y avisada por WhatsApp`)}

function newBooking(prop,date){const p=prop||S.props[0].id,a=date||addDays(TODAY,30),b=addDays(a,5);
  modal(`<button class="x" onclick="closeM()">×</button><h3>Nueva reserva</h3><div class="sub">La tarifa y el mínimo de noches se calculan solos según la temporada.</div>
  <div class="fgrid"><label>Propiedad<select id="fp" onchange="recalc()">${S.props.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${x.name} (${x.cap} pers.)</option>`).join('')}</select></label>
  <label>Origen<select id="fs"><option>Directa</option><option>Airbnb</option><option>Booking</option></select></label>
  <label>Entrada<input type="date" id="fi" value="${a}" onchange="recalc()"></label><label>Salida<input type="date" id="fo" value="${b}" onchange="recalc()"></label>
  <label>Huésped<input id="fg" placeholder="Nombre y apellido"></label><label>WhatsApp<input id="fph" placeholder="11 5555-5555"></label>
  <label>Personas<input type="number" id="fpe" value="2" min="1" onchange="recalc()"></label><label>Seña recibida<input type="number" id="fd" value="0" onchange="recalc()"></label>
  <div class="full calc" id="calc"></div><div class="full err" id="ferr"></div></div>
  <button class="btn" id="fsave" onclick="saveBooking()">Guardar reserva</button>`);recalc()}
function recalc(){const p=P($('#fp').value),a=$('#fi').value,b=$('#fo').value,pe=+$('#fpe').value;const e=$('#ferr');let err='';
  if(!a||!b||b<=a){$('#calc').innerHTML='Elegí fechas válidas.';$('#fsave').disabled=true;return}
  const q=quote(S,p,a,b);if(!+$('#fd').value)$('#fd').value=Math.round(q.total*.3);
  const ov=overlap(p.id,a,b);if(ov)err=`⚠ ${p.name} ya está reservada del ${dmy(ov.in)} al ${dmy(ov.out)} (${ov.guest}). No se permiten dobles reservas.`;
  else if(q.n<q.min)err=`⚠ En temporada ${q.season} el mínimo es de ${q.min} noches.`;
  else if(pe>p.cap)err=`⚠ ${p.name} tiene capacidad para ${p.cap} personas.`;
  $('#calc').innerHTML=`<div>${q.n} noches · temporada ${q.season}${q.per.alta&&q.per.media?' (cruza temporadas)':''}</div><div class="tot">Total: ${fmt(q.total)}</div><div>Seña sugerida (30%): ${fmt(q.total*.3)} · Saldo: ${fmt(q.total-(+$('#fd').value||0))}</div>`;
  e.textContent=err;$('#fsave').disabled=!!err}
function saveBooking(){recalc();if($('#fsave').disabled)return;const p=P($('#fp').value),a=$('#fi').value,b=$('#fo').value;const g=$('#fg').value.trim()||'Huésped de prueba';const q=quote(S,p,a,b);const dep=+$('#fd').value||0;
  const bk={id:uid('r'),prop:p.id,guest:g,phone:$('#fph').value||'11 0000-0000',people:+$('#fpe').value||2,in:a,out:b,source:$('#fs').value,status:dep>0?'confirmada':'pendiente',total:q.total,deposit:dep,paid:dep,checkin:{done:false,items:{}},checkout:{done:false},notes:'',created:TODAY};
  S.bookings.push(bk);addCleaning(S,bk);save();closeM();if(view==='calendario')calMonth=a.slice(0,7);render();toast(`Reserva guardada · ${bk.status==='confirmada'?'se programó el mensaje de confirmación':'queda esperando la seña'} y la limpieza del ${dmy(b)}`)}

const INV=['Llaves (2 juegos) y control del portón','Ropa blanca completa y 6 toallas','Vajilla y utensilios completos','Control remoto de TV y aire','Garrafa con carga / termotanque funcionando','Estado general sin roturas'];
let bTab='datos',photos=[];
function openBooking(id){bTab='datos';photos=[];showBooking(id)}
function showBooking(id){const b=BK(id),p=P(b.prop);const saldo=b.total-b.paid;
  const tabs=`<div class="tabs"><button class="${bTab==='datos'?'on':''}" onclick="bTab='datos';showBooking('${id}')">Datos y pagos</button><button class="${bTab==='check'?'on':''}" onclick="bTab='check';showBooking('${id}')">Check-in / check-out</button><button class="${bTab==='msg'?'on':''}" onclick="bTab='msg';showBooking('${id}')">Mensajes</button></div>`;
  let body='';
  if(bTab==='datos')body=`<div class="fgrid"><div><div class="sub">Huésped</div><b>${esc(b.guest)}</b><div class="sub">${esc(b.phone)} · ${b.people} personas</div></div><div><div class="sub">Estadía</div><b>${dmy(b.in)} → ${dmy(b.out)}</b><div class="sub">${nights(b.in,b.out)} noches · <span class="src src-${b.source}">${b.source}</span></div></div></div>
    <div class="calc"><div>Total: <b>${fmt(b.total)}</b></div><div>Pagado: <b>${fmt(b.paid)}</b></div><div class="tot">${saldo>0?`Saldo pendiente: ${fmt(saldo)}`:'Pagado completo ✓'}</div></div>
    <div class="row" style="margin-top:14px">${saldo>0?`<button class="btn g" onclick="pay('${b.id}')">Registrar pago del saldo</button>`:''}${b.status!=='cancelada'?`<button class="btn sec" onclick="cancelB('${b.id}')">Cancelar reserva</button>`:''}</div>`;
  if(bTab==='check'){const ci=b.checkin;body=`<div class="sub" style="margin:4px 0 8px">Inventario de ${p.name}. Se completa desde el celular al entregar y al recibir la casa.</div>
    ${INV.map((it,i)=>`<label class="chk"><input type="checkbox" ${ci.items[i]?'checked':''} onchange="BK('${b.id}').checkin.items[${i}]=this.checked;save()"> ${it}</label>`).join('')}
    <label style="margin-top:8px">Fotos del estado de la casa<input type="file" accept="image/*" multiple onchange="addPhotos(this,'${b.id}')"></label><div class="photos" id="ph">${photos.map(u=>`<img src="${u}">`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn ${ci.done?'sec':''}" onclick="BK('${b.id}').checkin.done=true;save();showBooking('${b.id}');toast('Check-in registrado')">${ci.done?'Check-in hecho ✓':'Registrar check-in'}</button>
    <button class="btn ${b.checkout.done?'sec':''}" ${ci.done?'':'disabled'} onclick="checkout('${b.id}')">${b.checkout.done?'Check-out hecho ✓':'Registrar check-out'}</button></div>`}
  if(bTab==='msg'){body=Object.keys(TPL).map(k=>{const sent=S.msgs.find(m=>m.bookingId===b.id&&m.type===k);return `<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b>${TPL[k].t}</b>${sent?`<span class="tag t-ok">Enviado ${dmy(sent.date)}</span>`:`<button class="btn sm g" onclick="sendMsg('${b.id}','${k}');showBooking('${b.id}')">Enviar ahora</button>`}</div><div class="msgtxt" style="margin-top:6px">${esc(TPL[k].f(b))}</div></div>`}).join('')}
  modal(`<button class="x" onclick="closeM()">×</button><h3>${p.name}</h3><div class="sub">${p.loc} · ${stTag(b)}</div>${tabs}${body}`)}
function addPhotos(inp,id){for(const f of inp.files)photos.push(URL.createObjectURL(f));showBooking(id);toast(`${inp.files.length} foto(s) adjuntada(s)`)}
function checkout(id){const b=BK(id);b.checkout.done=true;const t=S.tasks.find(t=>t.bookingId===id);save();showBooking(id);toast(`Check-out registrado. ${t?`Limpieza avisada a ${t.who}`:''}`)}
function pay(id){const b=BK(id);b.paid=b.total;if(b.status==='pendiente')b.status='confirmada';save();showBooking(id);render();toast('Pago registrado ✓')}
function cancelB(id){const b=BK(id);b.status='cancelada';S.tasks=S.tasks.filter(t=>t.bookingId!==id||t.status==='hecha');save();closeM();render();toast('Reserva cancelada: las fechas quedaron libres en todas las plataformas')}

function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('on')}
function closeM(){$('#ov').classList.remove('on');render()}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

save();render();
</script>
</body>
</html>
